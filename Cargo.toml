[workspace]
resolver = "3"
members = [
    "firmware/common",
    "firmware/led_inc",
    "firmware/switches",
    "firmware/pitch",
]

[workspace.package]
edition = "2024"

[workspace.lints.clippy]
pedantic = "warn"
nursery = "warn"
todo = "warn"

[workspace.dependencies]
common = { path = "firmware/common" }
num-traits = { version = "0.2.19", default-features = false }

[profile.release]
opt-level = "z"
strip = true
panic = "abort"
lto = "fat"
codegen-units = 1
